<figure [class.gift]="gift">
    <a class="painting" [routerLink]="linkToDetail()" queryParamsHandling="preserve"
        [attr.aria-label]="still ? null : 'Open ' + artwork.title">
        @if (artwork.images) {
        <img [src]="artwork.images.web.url" [alt]="artwork.title" width="300">
        } @else {
        <p>No image for this artwork</p>
        }
    </a>
    <figcaption>
        <strong>{{ gift ? 'A gift from ' + gift : shortArtistName(artwork) }}</strong>
        <cite>{{ artwork.title }}</cite>
        <small>{{ artwork.creation_date }}</small>
    </figcaption>
    @if (actionLabel || sendLink) {
    <div class="buttons">
        @if (actionLabel) {
        <button type="button" (click)="emitAction()">{{ actionLabel }}</button>
        }
        @if (sendLink) {
        <a class="send" [routerLink]="sendLink" aria-label="Send as a postcard" title="Send as a postcard">✉</a>
        }
    </div>
    }
</figure>
