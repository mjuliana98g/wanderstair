<header>
  <h1>{{ title }}</h1>
  <nav aria-label="Main navigation" [class.guest]="!user()">
    @if (user()) {
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">My stair</a>
    <a routerLink="/find" routerLinkActive="active">Find artworks</a>
    <a routerLink="/write" routerLinkActive="active">New memory</a>
          <a routerLink="/friends" routerLinkActive="active">Friends</a>
    } @else {
    <a routerLink="/sign-in" routerLinkActive="active">Sign in</a>
    <a routerLink="/create-account" routerLinkActive="active">Create account</a>
    }
  </nav>

  <div class="tools">
    @if (user()) {
    <div class="who">
      <a routerLink="/account"><strong>{{ userName() }}</strong></a>
    </div>
    }
    <button type="button" (click)="toggleTheme()" aria-label="Switch between day and night">
      @if (isNight()) { ☾ Night } @else { ☀︎ Day }
    </button>
  </div>
</header>

<main>
  <router-outlet />
</main>
