<h2>Find artworks</h2>

<form role="search" (ngSubmit)="search()">
  <label for="search-term">Search by title, artist or theme</label>
  <input id="search-term" name="term" type="search" placeholder="Monet, water, cats…" [(ngModel)]="term">
  <button type="submit">Search</button>
</form>

@if (term) {
  <p>Looking for: {{ term }}</p>
}

@if (loading()) {
  <p>Searching the castle archives…</p>
} @else if (error()) {
  <p role="alert">{{ error() }}</p>
} @else if (searched()) {
  <ul>
    @for (artwork of results(); track artwork.id) {
      <li>
        <app-frame [artwork]="artwork" />
      </li>
    } @empty {
      <li>No artworks found. Try another word.</li>
    }
  </ul>
}
